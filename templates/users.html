{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">ADMINISTRATION</span><h1>User accounts</h1><p class="muted">Create accounts for authorized clinic staff.</p></div></div><div class="detail-grid"><form method="post" class="panel form-panel"><h3>Create staff account</h3><div class="form-stack"><label>Username<input name="username" required></label><label>Password (minimum 10 characters)<input type="password" name="password" minlength="10" required></label><label>Role<select name="role"><option value="nurse">Nurse / clinic staff</option><option value="admin">Administrator</option></select></label><button class="btn primary">Create account</button></div></form><div class="panel"><h3>Current accounts</h3>{% for u in users %}<div class="user-row"><div class="avatar">{{ u.username[0]|upper }}</div><div><b>{{ u.username }}</b><small>{{ u.role|title }}</small></div></div>{% endfor %}</div></div>{% endblock %}
