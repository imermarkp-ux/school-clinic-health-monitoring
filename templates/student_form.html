{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">STUDENT DIRECTORY</span><h1>Add student</h1><p class="muted">Enter only the information needed by the clinic.</p></div><a class="btn secondary" href="{{ url_for('students') }}">← Back</a></div><form method="post" class="panel form-panel"><div class="form-grid"><label>Student number *<input name="student_no" value="{{ student.get('student_no','') }}" required></label><label>Full name *<input name="full_name" value="{{ student.get('full_name','') }}" required></label><label>Grade level *<input name="grade_level" placeholder="e.g. Grade 10" value="{{ student.get('grade_level','') }}" required></label><label>Section<input name="section" value="{{ student.get('section','') }}"></label><label>Date of birth<input type="date" name="birth_date" value="{{ student.get('birth_date','') }}"></label><label>Guardian name<input name="guardian_name" value="{{ student.get('guardian_name','') }}"></label><label>Guardian contact<input name="guardian_contact" value="{{ student.get('guardian_contact','') }}"></label><label>Known allergies<textarea name="allergies" rows="2">{{ student.get('allergies','') }}</textarea></label><label class="span-2">Other clinic notes<textarea name="notes" rows="3">{{ student.get('notes','') }}</textarea></label></div><div class="form-actions"><span class="muted">* Required fields</span><button class="btn primary">Save student</button></div></form>{% endblock %}
