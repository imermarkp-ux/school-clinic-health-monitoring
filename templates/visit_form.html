{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">CLINIC LOG</span><h1>Record clinic visit</h1><p class="muted">Document the visit and the care provided by clinic staff.</p></div><a class="btn secondary" href="{{ url_for('dashboard') }}">← Dashboard</a></div><form method="post" class="panel form-panel"><div class="form-grid"><label class="span-2">Student *<select name="student_id" required><option value="">Choose a student</option>{% for s in students %}<option value="{{ s.id }}">{{ s.student_no }} — {{ s.full_name }}</option>{% endfor %}</select>{% if not students %}<small class="field-help">No students yet. <a href="{{ url_for('add_student') }}">Add a student first.</a></small>{% endif %}</label><label>Visit date *<input type="date" name="visit_date" value="{{ today }}" required></label><label>Visit time *<input type="time" name="visit_time" value="{{ current_time }}" required></label><label class="span-2">Reason / complaint *<input name="complaint" placeholder="e.g. Headache, minor injury, feeling unwell" required></label><label class="span-2">Action taken<textarea name="action_taken" rows="3" placeholder="Record the action or care provided by authorized staff"></textarea></label><label class="span-2">Referral / referred to<input name="referred_to" placeholder="e.g. Parent/guardian contacted, referred to health professional"></label></div><div class="form-actions"><span class="muted">* Required fields</span><button class="btn primary" {% if not students %}disabled{% endif %}>Save and add vital signs →</button></div></form>{% endblock %}
